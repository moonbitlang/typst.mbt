[package]
name = "typst-oracle"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dumps reference outputs of upstream Typst for differential testing of typst.mbt"

[dependencies]
typst-syntax = { path = "../.repos/typst/crates/typst-syntax" }
typst-utils = { path = "../.repos/typst/crates/typst-utils", features = ["full"] }
unicode-ident = "1.0"
unicode-math-class = "0.1"
unicode-script = "0.5"
unicode-normalization = "0.1"
regex = "1"
regex-syntax = "0.8"
codex = { git = "https://github.com/typst/codex", rev = "2e43ab9" }
typst = { path = "../.repos/typst/crates/typst" }
typst-eval = { path = "../.repos/typst/crates/typst-eval" }
typst-library = { path = "../.repos/typst/crates/typst-library" }
typst-layout = { path = "../.repos/typst/crates/typst-layout" }
typst-html = { path = "../.repos/typst/crates/typst-html" }
typst-realize = { path = "../.repos/typst/crates/typst-realize" }
typst-pdf = { path = "../.repos/typst/crates/typst-pdf" }
typst-svg = { path = "../.repos/typst/crates/typst-svg" }
typst-render = { path = "../.repos/typst/crates/typst-render" }
tiny-skia = "0.12"
typst-bundle = { path = "../.repos/typst/crates/typst-bundle" }
typst-kit = { path = "../.repos/typst/crates/typst-kit", features = ["datetime"] }
typst-assets = { git = "https://github.com/typst/typst-assets", rev = "94dcb99", features = ["fonts"] }
typst-dev-assets = { git = "https://github.com/typst/typst-dev-assets", rev = "e26d7ca" }
comemo = "*"
ecow = "*"
parking_lot = "*"
rustc-hash = "*"
unscanny = "*"
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ttf-parser = "0.25"
icu_segmenter = { version = "2.3", features = ["serde"] }
icu_properties = "2.3"
icu_provider = { version = "2.3", features = ["serde"] }
icu_provider_blob = "2.3"
unicode-bidi = "0.3.18"
unicode-segmentation = "1.12"
hypher = "0.1.8"
# Bibliography stack (same versions as typst-library's lock).
hayagriva = "=0.10.1"
citationberg = "=0.7.0"
biblatex = "=0.12.0"
quick-xml = { version = "=0.38.4", features = ["serialize", "overlapped-lists"] }
icu_collator = "=2.3.1"
# Raw highlighting: fancy-regex / syntect / two-face (same versions/features
# as typst-library, plus `dump-load` to decode two-face's packed syntax set).
fancy-regex = "=0.16.2"
syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "regex-fancy", "plist-load", "yaml-load", "dump-load"] }
two-face = { version = "=0.4.5", default-features = false, features = ["syntect-fancy"] }
# YAML loader of syntect (sublime-syntax files).
yaml-rust = "=0.4.5"
rustybuzz = "0.20"
# The Unicode crates rustybuzz uses (gen_shape_unicode).
unicode-ccc = "0.4"
unicode-bidi-mirroring = "0.4"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# PDF semantic extraction (same revisions as upstream's test harness).
hayro-syntax = { git = "https://github.com/LaurenzV/hayro", rev = "d8e24e29eda62581e1ea15497effb2a884fb1608" }
indexmap = "2"
# usvg's CSS parser (gen_simplecss_tests).
simplecss = "=0.2.2"
# SVG attribute parsers used by usvg (gen_svgtypes_tests).
svgtypes = "=0.16.1"
# The SVG simplifier typst-library uses (gen_usvg_golden).
usvg = "=0.47.0"
fontdb = "=0.23.0"
roxmltree = "=0.21.1"
flate2 = "1"
# The SVG renderer typst-render uses (gen_resvg_golden).
resvg = { version = "=0.47.0", default-features = false, features = ["raster-images"] }
# The WebP and GIF decoders resvg and image use (gen_raster_golden).
image-webp = "=0.2.4"
gif = "=0.14.2"
# The `image` crate as typst-library uses it (gen_image_golden).
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
# tiny-skia-path (gen_tiny_skia_path_tests).
tiny-skia-path = "=0.12.0"
strict-num = "=0.1.1"
# The image resampler hayro uses (gen_pic_scale_tests), with hayro's features.
pic-scale = { version = "=0.7.12", default-features = false, features = ["neon", "rdm", "sse", "avx"] }
# The PDF renderer typst-render uses (gen_hayro_render_tests).
hayro = { git = "https://github.com/LaurenzV/hayro", rev = "d8e24e29eda62581e1ea15497effb2a884fb1608", default-features = false }
# kurbo stroke expansion (gen_kurbo_stroke_tests); same version as hayro's.
kurbo = "=0.13.1"

# Record every shaping call Typst makes (for the `shape` stage); see
# rustybuzz-tap/Cargo.toml.
[patch.crates-io]
rustybuzz = { path = "rustybuzz-tap" }
