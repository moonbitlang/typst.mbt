# A drop-in replacement for rustybuzz (patched in by oracle/Cargo.toml) that
# compiles the pristine rustybuzz sources from .repos/rustybuzz (fetched by
# scripts/upstream.sh) and records every `shape_with_plan` call, so that the
# oracle's `shape` stage can dump exactly the runs Typst shapes. Shaping
# behavior is unchanged.
[package]
name = "rustybuzz"
version = "0.20.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
bitflags = "2.4.1"
bytemuck = { version = "1.5", features = ["extern_crate_alloc"] }
core_maths = "0.1.0"
smallvec = "1.6"
unicode-bidi-mirroring = "0.4.0"
unicode-ccc = "0.4.0"
unicode-properties = { version = "0.1.3", default-features = false, features = ["general-category"] }
unicode-script = "0.5.2"
log = "0.4.22"

[dependencies.ttf-parser]
version = "0.25.0"
default-features = false
features = [
    "opentype-layout",
    "apple-layout",
    "variable-fonts",
    "glyph-names",
    "no-std-float",
]

[features]
default = ["std"]
std = ["ttf-parser/std"]
# Never enabled; declared so the pristine sources compile without warnings.
wasm-shaper = []
