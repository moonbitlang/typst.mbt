name: Publish to mooncakes

# Publishes moonbitlang/typst with the organization's mooncakes token
# (the module name must match the authenticated user, so it cannot be
# published from a personal login). Run manually after bumping `version` in
# moon.mod and verifying the differential stages locally. The typst skill
# is published separately at the same version. Use skill_only to publish
# just the skill (e.g. if module publishing succeeded but skill publishing failed).

on:
  workflow_dispatch:
    inputs:
      skill_only:
        description: Publish only the skill, using the version in moon.mod
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mooncakes-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
      - name: moon version
        run: |
          moon version --all
          moon update
      - name: Check
        if: ${{ !inputs.skill_only }}
        run: |
          moon check --target native
          moon check --target wasm
      - name: Package
        if: ${{ !inputs.skill_only }}
        # Pre-build steps do not run for dependencies: the package must
        # carry the generated font data (see .moonignore), and a consumer
        # that depends on the unpacked zip must build and run.
        run: |
          scripts/ci/package_smoke.sh native wasm
          ls -la _build/publish/
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SECRET" || { echo "Missing Mooncakes token" >&2; exit 1; }
          version=$(awk -F '"' '/^version = / { print $2 }' moon.mod)
          test -n "$version" || { echo "Missing version in moon.mod" >&2; exit 1; }
          # The skills CLI uploads the entire directory, without .gitignore
          # filtering. Stage only the skill, not the CLI sources beside it.
          skill_dir=$(mktemp -d "$RUNNER_TEMP/typst-skill.XXXXXX")
          cp cli/SKILL.md "$skill_dir/SKILL.md"
          umask 077
          mkdir -p "$HOME/.moon"
          trap 'rm -f "$HOME/.moon/credentials.json"' EXIT
          printf '%s\n' "$SECRET" > "$HOME/.moon/credentials.json"
          if [[ "$SKILL_ONLY" != "true" ]]; then
            moon publish
          fi
          moonx moonbit-community/skills --moon-home "$HOME/.moon" \
            publish "$skill_dir" --version "$version"
        env:
          SECRET: ${{ secrets.MOONCAKES_MOONBITLANG_TOKEN }}
          SKILL_ONLY: ${{ inputs.skill_only }}
